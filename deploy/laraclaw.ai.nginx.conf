# Static hosting for the Laraclaw documentation site.
#
# Install:  sudo cp /var/www/laraclaw.ai/laraclaw.ai.nginx.conf /etc/nginx/conf.d/laraclaw.conf
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d laraclaw.ai -d www.laraclaw.ai
# (certbot adds the 443 blocks and the http redirect automatically; run it AFTER
#  the DNS A records resolve, or the challenge fails.)

server {
    listen 80;
    listen [::]:80;

    server_name laraclaw.ai www.laraclaw.ai;
    root /var/www/laraclaw.ai/public;
    index index.html;

    # nuxt generate writes flat files, so /skills/overview lives on disk as
    # skills/overview.html. Try the .html before treating the path as a
    # directory, because skills/overview/ also exists and holds the payload.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Build assets carry a content hash in the filename, so a given URL never
    # changes what it points at.
    # Only add_header here, not expires as well, or nginx emits two
    # Cache-Control headers for the same response.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_og/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
